name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_BASE_URL: http://127.0.0.1:9
  EMBED_PROVIDER: fake
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check scripts
      - run: bash -n scripts/setup_memory_db.sh
      - run: bash -n scripts/vector_index_admin.sh

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_version.py
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        pg: ["16", "17"]
    name: tests (${{ matrix.python }}, pg${{ matrix.pg }})
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_DSN: postgresql://postgres:ci-only-throwaway@localhost:5432/postgres
      PG_DSN: postgresql://memory_app:ci-app-pass@localhost:5432/memory
      TEST_PG_DSN: postgresql://memory_app:ci-app-pass@localhost:5432/memory_test
      ATOM_MEMORY_ALLOW_DESTRUCTIVE_TESTS: "1"
      SETUP_SKIP_INSTALL: "1"
      MEMORY_DB_PASSWORD: ci-app-pass
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Wait for Postgres service
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 2
          done
          exit 1
        env:
          PGPASSWORD: ci-only-throwaway
      - run: bash scripts/setup_memory_db.sh memory memory_app "$MEMORY_DB_PASSWORD"
      - run: bash scripts/setup_memory_db.sh memory_test memory_app "$MEMORY_DB_PASSWORD"
      - run: pytest -q -m "" --cov=scripts --cov-report=term --cov-report=xml
      - run: python scripts/tests/test_split.py
